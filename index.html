<!doctype html>
<html lang="ml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>Mitra</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <header class="hello">
      <h1 id="hello"></h1>
      <div class="place" id="place"></div>
    </header>

    <section class="card summary" aria-live="polite">
      <a href="daily.html" id="today-card">
        <h2 id="today-title"></h2>
        <div class="big-number" id="today-total">₹0</div>
        <div class="sub" id="today-sub"></div>
      </a>
      <a href="profit.html" id="month-card">
        <h2 id="month-title"></h2>
        <div class="big-number" id="month-profit">₹0</div>
        <div class="sub" id="month-sub"></div>
      </a>
    </section>

    <section class="card" id="today-list-card" hidden>
      <div id="today-list"></div>
    </section>

    <section>
      <button class="btn call" id="call-me" type="button">
        <span class="ic-wrap" id="call-icon"></span>
        <span id="call-me-label"></span>
      </button>
      <p class="note" id="call-hint" style="text-align:center;margin:8px 0 0"></p>
    </section>

    <h2 class="section-title" id="all-title"></h2>
    <nav class="card menu" id="menu" aria-label="Sections"></nav>

    <button class="btn small" id="reset" type="button"></button>
  </main>

  <script type="module">
    import { listen, get, getUser, loadDemo } from './js/data.js';
    import { monthProfit, thisMonth, today, salesIncome } from './js/calc.js';
    import { ml, en, label, rupees, esc, icon, renderNav, toast } from './js/app.js';

    const $ = (id) => document.getElementById(id);
    renderNav();

    const user = await getUser();
    $('hello').innerHTML = `<span class="ml">${ml('hello')}, ${esc(user.name_ml ?? user.name ?? '')}</span><span class="en">${en('hello')}, ${esc(user.name ?? '')}</span>`;
    $('place').textContent = [user.place_ml, user.place].filter(Boolean).join(' · ');
    $('today-title').innerHTML = label('today_sales');
    $('month-title').innerHTML = label('month_profit');
    $('call-icon').innerHTML = icon('phone', 20);
    $('call-me-label').innerHTML = label('call_me');
    $('call-hint').innerHTML = `${ml('call_me_hint')}<br>${en('call_me_hint')}`;
    $('all-title').innerHTML = label('everything');
    $('reset').innerHTML = `${icon('reset', 16)} ${ml('reset_demo')} · ${en('reset_demo')}`;

    const MENU = [
      ['daily.html', 'receipt', 'tile_daily', 'tile_daily_sub'],
      ['setup.html', 'box', 'tile_setup', 'tile_setup_sub'],
      ['money.html', 'wallet', 'tile_money', 'tile_money_sub'],
      ['schemes.html', 'file', 'tile_schemes', 'tile_schemes_sub'],
      ['bulk.html', 'users', 'tile_bulk', 'tile_bulk_sub'],
      ['support.html', 'heart', 'tile_support', 'tile_support_sub'],
    ];
    $('menu').innerHTML = MENU.map(([href, ic, key, sub]) => `
      <a href="${href}">
        <span class="badge">${icon(ic)}</span>
        <span class="grow"><span class="ml">${ml(key)}</span><span class="en">${en(sub)}</span></span>
        <span class="chev">${icon('chevron', 20)}</span>
      </a>`).join('');

    let products = await get('products');
    let bills = await get('bills');
    let purchases = await get('purchases');
    let seen = null; // sale ids already shown, to spot new ones from the call

    function render(sales) {
      const day = today();
      const todays = sales.filter((s) => s.date === day);

      $('today-total').textContent = rupees(salesIncome(todays, products));
      const count = todays.reduce((n, s) => n + s.qty, 0);
      $('today-sub').textContent = count ? `${count} ${en('items_sold')}` : en('no_sales_today');

      const rows = products.map((p) => {
        const qty = todays.filter((s) => s.product === p.id).reduce((n, s) => n + s.qty, 0);
        return qty ? `<div class="item"><span class="grow"><span class="ml">${esc(p.name_ml)}</span><span class="en">${esc(p.name_en)}</span></span><span class="amount">${qty} × ${rupees(p.price)}</span></div>` : '';
      }).join('');
      $('today-list').innerHTML = rows;
      $('today-list-card').hidden = !rows;

      const m = monthProfit(sales, products, bills, purchases, thisMonth());
      $('month-profit').textContent = rupees(m.profit);
      $('month-profit').className = `big-number ${m.profit >= 0 ? 'positive' : 'negative'}`;
      $('month-sub').textContent = `${rupees(m.income)} − ${rupees(m.spending)}`;

      // Highlight sales that just arrived from a phone call
      const fresh = seen ? sales.filter((s) => !seen.has(s.id)) : [];
      seen = new Set(sales.map((s) => s.id));
      if (fresh.some((s) => s.via === 'call' || s.via === 'web-call')) {
        for (const el of [$('today-card').parentElement, $('today-list-card')]) {
          el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
        }
        toast('added_by_call', 'phone');
      }
    }

    listen('sales', render);
    listen('products', async (p) => { products = p; render(await get('sales')); });
    listen('bills', async (b) => { bills = b; render(await get('sales')); });
    listen('purchases', async (p) => { purchases = p; render(await get('sales')); });

    // "Call me": Hiba's backend rings the demo phone (PLAN.md §5, call-me function).
    $('call-me').addEventListener('click', async () => {
      const btn = $('call-me');
      btn.disabled = true;
      $('call-me-label').innerHTML = label('calling');
      try {
        const res = await fetch('/.netlify/functions/call-me', { method: 'POST' });
        if (!res.ok) throw new Error(res.status);
        toast('call_started', 'phone');
      } catch {
        toast('call_unavailable', 'phone');
      } finally {
        btn.disabled = false;
        $('call-me-label').innerHTML = label('call_me');
      }
    });

    $('reset').addEventListener('click', async () => {
      await loadDemo();
      seen = null;
      products = await get('products'); bills = await get('bills'); purchases = await get('purchases');
      render(await get('sales'));
      toast('reset_done', 'reset');
    });
  </script>
</body>
</html>
