<!doctype html>
<html lang="ml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d6b5c">
  <title>Mitra</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <header class="hello">
      <div class="avatar" id="avatar" aria-hidden="true"></div>
      <div class="grow">
        <h1 id="hello"></h1>
        <div class="place" id="place"></div>
      </div>
      <span class="brandmark">Mitra</span>
    </header>

    <a class="card hero" href="profit.html" id="month-card" aria-live="polite">
      <span class="palm" id="palm"></span>
      <div class="label-row">
        <h2 id="month-title"></h2>
        <span class="chip live" id="live"></span>
      </div>
      <div class="big-number" id="month-profit">₹0</div>
      <div class="bar" aria-hidden="true"><i id="kept-bar" style="width:0"></i></div>
      <div class="split">
        <div><div class="k"><span class="dot in"></span><span id="in-label"></span></div><div class="v" id="month-in">₹0</div></div>
        <div><div class="k"><span class="dot out"></span><span id="out-label"></span></div><div class="v" id="month-out">₹0</div></div>
      </div>
    </a>

    <a class="card goal-strip" href="money.html" id="goal-strip" hidden>
      <div class="goal-text">
        <span class="ml" id="goal-name"></span>
        <span class="en" id="goal-sub"></span>
      </div>
      <div class="road">
        <span class="car" id="goal-car"></span>
        <span class="flag" id="goal-flag"></span>
        <span class="track"><i id="goal-track"></i></span>
      </div>
    </a>

    <section class="card" id="today-card">
      <a class="today" href="daily.html">
        <span class="badge tone-gold" style="width:50px;height:50px;border-radius:16px;display:grid;place-items:center" id="today-icon"></span>
        <span class="grow">
          <h2 id="today-title"></h2>
          <span class="sub" id="today-sub"></span>
        </span>
        <span class="big-number" id="today-total">₹0</span>
      </a>
      <div class="today-items" id="today-list"></div>
    </section>

    <section>
      <button class="btn call" id="call-me" type="button">
        <span class="ic-wrap" id="call-icon"></span>
        <span class="grow"><span id="call-me-label"></span><span class="en" id="call-hint" style="font-size:.78rem;margin-top:2px"></span></span>
        <span class="go" id="call-go"></span>
      </button>
    </section>

    <section class="card noticed" id="noticed-card" hidden>
      <h2 id="noticed-title"></h2>
      <div id="noticed"></div>
      <a class="more" href="profit.html" id="noticed-more"></a>
    </section>

    <h2 class="section-title" id="all-title"></h2>
    <nav class="tiles" id="menu" aria-label="Sections"></nav>

    <button class="btn small" id="reset" type="button"></button>
    <a class="btn small" id="join-link" href="join.html"></a>
  </main>

  <script type="module">
    import { listen, get, getUser, loadDemo } from './js/data.js';
    import { monthProfit, thisMonth, today, salesIncome } from './js/calc.js';
    import { ml, en, label, rupees, esc, icon, renderNav, toast, countTo } from './js/app.js';
    import { autoArt, foodArt, palmArt } from './js/art.js';
    import { insights, insightHTML } from './js/insights.js';
    import { goalPlan } from './js/money.js';
    import { avgMonthlyProfit } from './js/calc.js';

    const $ = (id) => document.getElementById(id);
    renderNav();

    const user = await getUser();
    $('avatar').textContent = (user.name_ml ?? user.name ?? 'M').slice(0, 1);
    $('hello').innerHTML = `<span class="ml">${ml('hello')}, ${esc(user.name_ml ?? user.name ?? '')}</span><span class="en">${en('hello')}, ${esc(user.name ?? '')}</span>`;
    $('place').innerHTML = `${icon('pin', 14)}<span>${esc([user.place_ml, user.place].filter(Boolean).join(' · '))}</span>`;
    $('month-title').innerHTML = label('month_profit');
    $('live').textContent = en('live');
    $('in-label').textContent = `${ml('income')} · ${en('income')}`;
    $('out-label').textContent = `${ml('spending')} · ${en('spending')}`;
    $('today-icon').innerHTML = icon('receipt', 24);
    $('today-title').innerHTML = label('today_sales');
    $('call-icon').innerHTML = icon('phone', 24);
    $('call-go').innerHTML = icon('arrow', 22);
    $('call-me-label').innerHTML = `<span class="ml">${ml('call_me')}</span><span class="en">${en('call_me')}</span>`;
    $('call-hint').textContent = ml('call_me_hint');
    $('all-title').innerHTML = label('everything');
    $('palm').innerHTML = palmArt;
    $('noticed-title').innerHTML = `<span style="display:flex;gap:8px;align-items:center">${icon('sparkle', 20)}<span>${label('noticed_title')}</span></span>`;
    $('noticed-more').innerHTML = `${ml('see_all')} · ${en('see_all')} ${icon('arrow', 16)}`;
    $('join-link').innerHTML = `${icon('users', 16)} ${ml('join_link')} · ${en('join_link')}`;
    $('reset').innerHTML = `${icon('reset', 16)} ${ml('reset_demo')} · ${en('reset_demo')}`;

    const MENU = [
      ['daily.html', 'receipt', 'tile_daily', 'tile_daily_sub', 'tone-teal'],
      ['setup.html', 'box', 'tile_setup', 'tile_setup_sub', 'tone-gold'],
      ['money.html', 'wallet', 'tile_money', 'tile_money_sub', 'tone-leaf'],
      ['schemes.html', 'file', 'tile_schemes', 'tile_schemes_sub', 'tone-sky'],
      ['bulk.html', 'users', 'tile_bulk', 'tile_bulk_sub', 'tone-plum'],
      ['support.html', 'heart', 'tile_support', 'tile_support_sub', 'tone-rose'],
    ];
    $('menu').innerHTML = MENU.map(([href, ic, key, sub, tone]) => `
      <a class="tile" href="${href}">
        <span class="badge ${tone}">${icon(ic)}</span>
        <span><span class="ml">${ml(key)}</span><span class="en">${en(sub)}</span></span>
      </a>`).join('');

    let products = await get('products');
    let bills = await get('bills');
    let purchases = await get('purchases');
    let history = await get('history');
    let goals = await get('goals');
    let seen = null; // sale ids already shown, to spot new ones from the call

    function render(sales) {
      const day = today();
      const todays = sales.filter((s) => s.date === day);

      countTo($('today-total'), salesIncome(todays, products));
      const count = todays.reduce((n, s) => n + s.qty, 0);
      $('today-sub').textContent = count ? `${count} ${en('items_sold')}` : en('no_sales_today');

      $('today-list').innerHTML = products.map((p) => {
        const qty = todays.filter((s) => s.product === p.id).reduce((n, s) => n + s.qty, 0);
        return qty ? `<span>${foodArt(p, 26)}<b>${qty}</b> ${esc(p.name_ml)}</span>` : '';
      }).join('');

      const m = monthProfit(sales, products, bills, purchases, thisMonth());
      countTo($('month-profit'), m.profit);
      $('month-profit').className = `big-number ${m.profit >= 0 ? '' : 'negative'}`;
      countTo($('month-in'), m.income);
      countTo($('month-out'), m.spending);
      // Gold bar = share of income she keeps as profit
      $('kept-bar').style.width = `${m.income > 0 ? Math.max(0, Math.min(100, (m.profit / m.income) * 100)) : 0}%`;

      const FLAG = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 21V4" stroke="#17231f" stroke-width="2" stroke-linecap="round"/><path d="M5 4h13l-3 4 3 4H5z" fill="#c9971f"/></svg>';
      // Savings goal on the road: the auto drives towards the flag as she saves
      const goal = goals[0];
      $('goal-strip').hidden = !goal;
      if (goal) {
        const g = goalPlan(goal, avgMonthlyProfit(history, 3));
        $('goal-name').innerHTML = `${esc(goal.name_ml)} <b>${g.pct}%</b>`;
        $('goal-sub').textContent = `${esc(goal.name_en.split(' (')[0])} · ${rupees(goal.saved)} / ${rupees(goal.target)}`;
        $('goal-car').innerHTML = autoArt(g.pct, { width: 92 });
        $('goal-car').style.left = `calc(${g.pct}% * .78)`;
        $('goal-track').style.width = `${g.pct}%`;
        $('goal-flag').innerHTML = `${FLAG}<b>${rupees(g.left)}</b><span>${ml('goal_left')}</span>`;
      }

      // A few things Mitra noticed in her numbers
      const list = insights({ sales, products, bills, purchases, history, goals }).slice(0, 2);
      $('noticed-card').hidden = !list.length;
      $('noticed').innerHTML = list.map(insightHTML).join('');

      // Highlight sales that just arrived from a phone call
      const fresh = seen ? sales.filter((s) => !seen.has(s.id)) : [];
      seen = new Set(sales.map((s) => s.id));
      if (fresh.some((s) => s.via === 'call' || s.via === 'web-call')) {
        for (const el of [$('month-card'), $('today-card')]) {
          el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
        }
        toast('added_by_call', 'phone');
      }
    }

    listen('sales', render);
    listen('products', async (p) => { products = p; render(await get('sales')); });
    listen('bills', async (b) => { bills = b; render(await get('sales')); });
    listen('purchases', async (p) => { purchases = p; render(await get('sales')); });
    listen('history', async (h) => { history = h; render(await get('sales')); });
    listen('goals', async (g) => { goals = g; render(await get('sales')); });

    // "Call me": Hiba's backend rings the demo phone (PLAN.md §5, call-me function).
    $('call-me').addEventListener('click', async () => {
      const btn = $('call-me');
      btn.disabled = true;
      $('call-me-label').innerHTML = label('calling');
      try {
        const res = await fetch('/.netlify/functions/call-me', { method: 'POST' });
        if (!res.ok) throw new Error(res.status);
        toast('call_started', 'phone');
      } catch {
        toast('call_unavailable', 'phone');
      } finally {
        btn.disabled = false;
        $('call-me-label').innerHTML = label('call_me');
      }
    });

    $('reset').addEventListener('click', async () => {
      await loadDemo();
      seen = null;
      products = await get('products'); bills = await get('bills'); purchases = await get('purchases');
      history = await get('history'); goals = await get('goals');
      render(await get('sales'));
      toast('reset_done', 'reset');
    });
  </script>
</body>
</html>
