<!doctype html>
<html lang="ml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d6b5c">
  <title>Mitra · Schemes</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <div id="top"></div>
    <div id="list" aria-live="polite"></div>
  </main>

  <script type="module">
    // Non-loan schemes she can join now. Each entry was checked on the official page, with the source URL and
    // date stored next to it (CLAUDE.md); entries without both, marked as loans, or past their last date to
    // apply (open_until) are not shown. Same list as the Flutter app and the phone call:
    // data/schemes.json if the team adds one, else app/assets/data/schemes.json. Owner: Hiba.
    import { ml, en, esc, topbar, renderNav } from './js/app.js';
    import { today } from './js/calc.js';

    const $ = (id) => document.getElementById(id);
    renderNav();
    $('top').innerHTML = topbar('tile_schemes');

    const pick = (r, base, lang) => r[`${base}_${lang}`] ?? r[`${base}_${lang === 'ml' ? 'en' : 'ml'}`] ?? '';
    const both = (r, base) => pick(r, base, 'ml') ? `<span class="ml">${esc(pick(r, base, 'ml'))}</span><span class="en">${esc(pick(r, base, 'en'))}</span>` : '';
    const open = (r) => /^https?:\/\//.test(r.source_url ?? '') && r.date_checked && r.loan !== true
      && (r.open_until == null || String(r.open_until) >= today());

    async function load() {
      for (const url of ['data/schemes.json', 'app/assets/data/schemes.json']) {
        try {
          const res = await fetch(url);
          if (!res.ok) continue;
          const data = await res.json();
          return (Array.isArray(data) ? data : data.schemes ?? []).filter(open);
        } catch { /* try the next one */ }
      }
      return [];
    }

    const list = await load();
    const line = (icon, html) => html ? `<p class="row" style="justify-content:flex-start;gap:10px"><span aria-hidden="true">${icon}</span><span>${html}</span></p>` : '';
    $('list').innerHTML = list.length ? list.map((s) => `
      <section class="card">
        <h2>${both(s, 'title')}</h2>
        <p>${both(s, 'about')}</p>
        ${line('₹', both(s, 'cost'))}
        ${line('👤', both(s, 'who'))}
        ${(s.documents ?? []).length ? `
          <h3><span class="ml">വേണ്ട രേഖകൾ</span><span class="en">Documents you need</span></h3>
          ${s.documents.map((d) => `<label class="item"><input type="checkbox">
            <span><span class="ml">${esc(d.ml ?? d.en ?? d)}</span><span class="en">${esc(d.en ?? '')}</span></span></label>`).join('')}` : ''}
        ${line('📍', both(s, 'how'))}
        <p class="note muted">${ml('checked_on')} · ${en('checked_on')}: ${esc(s.date_checked)} ·
          <a href="${esc(s.source_url)}" target="_blank" rel="noopener">${esc(new URL(s.source_url).host)}</a></p>
      </section>`).join('') : `
      <section class="card">
        <p><span class="ml">പദ്ധതികളുടെ വിവരങ്ങൾ ഔദ്യോഗിക സൈറ്റുകളിൽ ഉറപ്പാക്കിക്കൊണ്ടിരിക്കുന്നു.</span>
        <span class="en">Scheme details are still being checked on official sites.</span></p>
      </section>`;
  </script>
</body>
</html>
