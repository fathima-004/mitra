<!doctype html>
<html lang="ml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>Mitra · Today's sales</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <div id="top"></div>

    <label class="field card" style="padding:12px 16px">
      <span id="day-label"></span>
      <input type="date" id="day">
    </label>

    <section>
      <h2 id="tap-title" style="margin:4px 0 10px"></h2>
      <div class="product-grid" id="products"></div>
    </section>

    <section class="card" aria-live="polite">
      <h2 id="entries-title"></h2>
      <div class="big-number" id="day-total">₹0</div>
      <div id="entries"></div>
    </section>
  </main>

  <script type="module">
    import { get, add, remove, listen } from './js/data.js';
    import { today, salesIncome } from './js/calc.js';
    import { ml, en, label, rupees, esc, icon, topbar, renderNav, toast } from './js/app.js';

    const $ = (id) => document.getElementById(id);
    renderNav();
    $('top').innerHTML = topbar('daily_title');
    $('day-label').innerHTML = label('sold_on');
    $('tap-title').innerHTML = label('tap_product');
    $('entries-title').innerHTML = label('entries');
    $('day').value = today();
    $('day').max = today();

    let products = [];
    let sales = [];

    function render() {
      const day = $('day').value;
      const daySales = sales.filter((s) => s.date === day);

      // One big button per product, showing how many sold that day.
      $('products').innerHTML = products.map((p) => {
        const qty = daySales.filter((s) => s.product === p.id).reduce((n, s) => n + s.qty, 0);
        return `<button class="product-btn" data-product="${esc(p.id)}">
          <span><span class="ml">${esc(p.name_ml)}</span><span class="en">${esc(p.name_en)}</span></span>
          <span class="foot"><span class="price">${rupees(p.price)}</span>${qty ? `<span class="pill green">${qty}</span>` : ''}</span>
        </button>`;
      }).join('') || `<p class="muted">${ml('nothing_yet')} · <a href="setup.html">${ml('setup_title')}</a></p>`;

      $('day-total').textContent = rupees(salesIncome(daySales, products));
      const name = (id) => products.find((p) => p.id === id);
      $('entries').innerHTML = [...daySales].reverse().map((s) => {
        const p = name(s.product);
        return `<div class="item">
          <div class="grow">
            <span class="ml">${esc(p?.name_ml ?? s.product)} × ${s.qty}</span>
            <span class="en">${esc(p?.name_en ?? '')}${s.via === 'call' || s.via === 'web-call' ? ` · ${en('via_call')}` : ''}</span>
          </div>
          ${s.via === 'call' || s.via === 'web-call' ? `<span class="pill">${icon('phone', 14)}</span>` : ''}
          <span class="amount">${rupees(s.qty * (p?.price ?? 0))}</span>
          <button class="icon-btn danger" data-undo="${esc(s.id)}" aria-label="${en('undo')}">${icon('undo', 18)}</button>
        </div>`;
      }).join('') || `<p class="muted">${ml('no_sales_today')}<span class="en">${en('no_sales_today')}</span></p>`;
    }

    listen('products', (p) => { products = p; render(); });
    listen('sales', (s) => { sales = s; render(); });
    $('day').addEventListener('change', render);

    $('entries').addEventListener('click', async (e) => {
      const b = e.target.closest('[data-undo]');
      if (!b) return;
      await remove('sales', b.dataset.undo);
      toast(`${ml('deleted')} · ${en('deleted')}`);
    });

    $('products').addEventListener('click', (e) => {
      const b = e.target.closest('[data-product]');
      if (b) openKeypad(products.find((p) => p.id === b.dataset.product));
    });

    // Phone-style keypad sheet for the quantity.
    function openKeypad(product) {
      let qty = '';
      const back = document.createElement('div');
      back.className = 'sheet-backdrop';
      back.innerHTML = `
        <div class="sheet" role="dialog" aria-modal="true" aria-label="${en('how_many')}">
          <div><span class="ml">${esc(product.name_ml)} · ${ml('how_many')}</span><span class="en">${esc(product.name_en)} · ${en('how_many')}</span></div>
          <div class="qty-display" id="qty">0</div>
          <div class="muted" id="qty-money" style="text-align:center"></div>
          <div class="keypad">
            ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => `<button data-k="${n}">${n}</button>`).join('')}
            <button data-k="del" aria-label="Delete digit">${icon('backspace', 26)}</button>
            <button data-k="0">0</button>
            <button data-k="ok" class="ok" aria-label="${en('add')}">${icon('check', 28)}</button>
          </div>
          <button class="btn small" data-k="cancel">${ml('cancel')} · ${en('cancel')}</button>
        </div>`;
      document.body.append(back);
      const show = () => {
        back.querySelector('#qty').textContent = qty || '0';
        back.querySelector('#qty-money').textContent = qty ? rupees(Number(qty) * product.price) : '';
      };
      const close = () => { back.remove(); document.removeEventListener('keydown', onKey); };
      const press = async (k) => {
        if (k === 'cancel') return close();
        if (k === 'del') qty = qty.slice(0, -1);
        else if (k === 'ok') {
          if (!Number(qty)) return;
          await add('sales', { date: $('day').value, product: product.id, qty: Number(qty), via: 'app' });
          close();
          toast(`${ml('added_sale')} · ${Number(qty)} ${product.name_en}`);
          return;
        } else if (qty.length < 3) qty = (qty + k).replace(/^0+/, '');
        show();
      };
      const onKey = (e) => {
        if (/^[0-9]$/.test(e.key)) press(e.key);
        else if (e.key === 'Backspace') press('del');
        else if (e.key === 'Enter') press('ok');
        else if (e.key === 'Escape') press('cancel');
      };
      back.addEventListener('click', (e) => {
        const k = e.target.closest('[data-k]')?.dataset.k;
        if (k) press(k);
        else if (e.target === back) close();
      });
      document.addEventListener('keydown', onKey);
      show();
      back.querySelector('[data-k="1"]').focus();
    }
  </script>
</body>
</html>
